<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <title>CSS Hover Animations</title>
  </head>
  <body>
    <main class="animation-gallery">
      <h1>CSS hover animations</h1>
      <p class="intro">Hover over a tile, or focus it with your keyboard, to see the effect.</p>
      <section class="tile-grid" aria-label="Eight CSS hover animation examples">
        <div class="tile fade" tabindex="0" aria-label="Fade animation">
          <span>1. Fade</span>
        </div>
        <div class="tile color" tabindex="0" aria-label="Color animation">
          <span>2. Color</span>
        </div>
        <div class="tile shrink" tabindex="0" aria-label="Shrink animation">
          <span>3. Shrink</span>
        </div>
        <div class="tile rotate" tabindex="0" aria-label="Rotate animation">
          <span>4. Rotate</span>
        </div>
        <div class="tile circle" tabindex="0" aria-label="Circle animation">
          <span>5. Circle</span>
        </div>
        <div class="tile threed" tabindex="0" aria-label="Three-dimensional shadow animation">
          <span>6. Shadow</span>
        </div>
        <div class="tile swing" tabindex="0" aria-label="Swing animation">
          <span>7. Swing</span>
        </div>
        <div class="tile border" tabindex="0" aria-label="Inset border animation">
          <span>8. Border</span>
        </div>
      </section>
    </main>
  </body>
</html>
