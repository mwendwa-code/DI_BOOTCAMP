<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="login-signup.css" />
    <title>Log in — Morrow</title>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="Morrow home">
          <i class="fa-solid fa-leaf" aria-hidden="true"></i> morrow
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="products.html">Shop</a>
          <a href="signup.html">Join us</a>
        </nav>
      </div>
    </header>

    <main class="account-page">
      <section class="account-card">
        <p class="eyebrow">Good to see you again</p>
        <h1>Log in</h1>
        <p class="account-intro">Pick up where you left off.</p>
        <form action="#" method="get">
          <label>
            Username
            <input type="text" name="username" autocomplete="username" required />
          </label>
          <label>
            Password
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Log in</button>
        </form>
        <p class="account-switch">New to Morrow? <a href="signup.html">Create an account</a></p>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <time datetime="2026">2026</time> Morrow. Designed and built by the Morrow team.</p>
    </footer>
  </body>
</html>
