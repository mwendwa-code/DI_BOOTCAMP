<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="login-signup.css" />
    <title>Create an account — Morrow</title>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="Morrow home">
          <i class="fa-solid fa-leaf" aria-hidden="true"></i> morrow
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="products.html">Shop</a>
          <a href="login.html">Log in</a>
        </nav>
      </div>
    </header>

    <main class="account-page">
      <section class="account-card">
        <p class="eyebrow">Welcome to Morrow</p>
        <h1>Create your account</h1>
        <p class="account-intro">Join us for new finds and everyday favorites.</p>
        <form action="#" method="get">
          <div class="name-fields">
            <label>
              First name
              <input type="text" name="firstname" autocomplete="given-name" required />
            </label>
            <label>
              Last name
              <input type="text" name="lastname" autocomplete="family-name" required />
            </label>
          </div>
          <label>
            Username
            <input type="text" name="username" autocomplete="username" required />
          </label>
          <label>
            Email
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <label>
            Password
            <input type="password" name="password" autocomplete="new-password" required />
          </label>
          <button type="submit">Create account</button>
        </form>
        <p class="account-switch">Already have an account? <a href="login.html">Log in</a></p>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <time datetime="2026">2026</time> Morrow. Designed and built by the Morrow team.</p>
    </footer>
  </body>
</html>
