<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mad Libs</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
      }

      form {
        max-width: 400px;
      }

      label {
        display: inline-block;
        width: 140px;
        margin-bottom: 10px;
      }

      input {
        margin-bottom: 10px;
        padding: 8px;
        width: 200px;
      }

      button {
        margin-right: 10px;
        padding: 10px 15px;
        cursor: pointer;
      }

      #story {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Mad Libs</h1>

    <form id="libform">
      <label for="noun">Noun:</label>
      <input type="text" id="noun" name="noun" />
      <br />

      <label for="adjective">Adjective:</label>
      <input type="text" id="adjective" name="adjective" />
      <br />

      <label for="person">Someone's Name:</label>
      <input type="text" id="person" name="person" />
      <br />

      <label for="verb">Verb:</label>
      <input type="text" id="verb" name="verb" />
      <br />

      <label for="place">A place:</label>
      <input type="text" id="place" name="place" />
      <br />

      <button type="submit" id="lib-button">Lib it!</button>
      <button type="button" id="shuffle-button">Shuffle</button>
    </form>

    <p>
      Generated story:
      <span id="story"></span>
    </p>

    <script src="daily challenge tell the story.js"></script>
  </body>
</html>
