<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Exercise</title>
    <style>
    p {
      background: yellow;
      color: red;
    }
    button {
        padding: 10px 20px;
        margin: 10px 0;
        cursor: pointer;
        background-color: #333;
        color: white;
        border: none;
        border-radius: 4px;
    }
    button:hover {
        background-color: #555;
    }
    #container {
        background-color: #f9f9f9;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-top: 20px;
    }
    </style>
</head>
<body>
    <h2>Exercise 1: Timer</h2>
    
    <div>
        <button id="startPartI">Part I: Alert after 2 seconds</button>
        <button id="startPartII">Part II: Add paragraph after 2 seconds</button>
        <button id="startPartIII">Part III: Add paragraph every 2 seconds</button>
    </div>
    
    <div id="container"></div>
    <button id="clear">Clear Interval</button>

    <script src="exercise xp  animation.js"></script>
</body>
</html>
