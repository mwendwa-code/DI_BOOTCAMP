<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2 - Work with Forms</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
        }
        form {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background-color: #555;
        }
        .usersAnswer {
            background-color: #f0f0f0;
            padding: 20px;
            border-radius: 4px;
        }
        .usersAnswer li {
            padding: 8px;
            margin-bottom: 5px;
            background-color: white;
            border-left: 3px solid #333;
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>
    <h2>Submit User Information</h2>
    <form>
        <label for="fname">First name:</label>
        <input type="text" id="fname" name="firstname">
        <label for="lname">Last name:</label>
        <input type="text" id="lname" name="lastname">
        <input type="submit" value="Submit" id="submit">
    </form>
    <h3>Submitted Users:</h3>
    <ul class="usersAnswer"></ul>

    <script src="exercise2.js"></script>
</body>
</html>
