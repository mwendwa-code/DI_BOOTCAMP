<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3 - Transform the Sentence</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        p {
            line-height: 1.8;
            font-size: 18px;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        strong {
            font-weight: bold;
        }
        .info {
            background-color: #e3f2fd;
            padding: 10px;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>Hover over the text to highlight bold items</h2>
    <p>
        <strong>Hello</strong> I hope you are enjoying <strong>this</strong> class. At the
        <strong>end</strong> you <strong>will</strong> be great Developers!
        <strong>Enjoy</strong> the <strong>JavaScript </strong> lessons
    </p>
    
    <div class="info">
        <p><strong>Instructions:</strong> Hover over the paragraph to see all bold items turn blue. Move your mouse out to return them to black.</p>
    </div>

    <script src="exercise3.js"></script>
</body>
</html>
