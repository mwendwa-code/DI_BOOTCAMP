<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2 - Delete colors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
        }
        form {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        select {
            padding: 8px;
            font-size: 16px;
            margin: 10px 0;
            width: 200px;
        }
        input[type="button"] {
            padding: 10px 20px;
            margin-top: 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="button"]:hover {
            background-color: #555;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Exercise 2: Delete colors</h1>
    
    <form>
        <label for="colorSelect">Select a color to remove:</label>
        <select id="colorSelect">
            <option>Red</option>
            <option>Green</option>
            <option>White</option>
            <option>Black</option>
        </select>
        <input type="button" value="Select and Remove">
    </form>

    <script src="exercise xp gold.js"></script>
</body>
</html>
