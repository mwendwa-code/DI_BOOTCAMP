<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move the Box Exercise</title>
    <style>
    #container {
      width: 400px;
      height: 400px;
      position: relative;
      background: yellow;
      margin: 20px 0;
    }
    #animate {
      width: 50px;
      height: 50px;
      position: absolute;
      background-color: red;
    }
    button {
        padding: 10px 20px;
        margin: 10px 0;
        cursor: pointer;
        background-color: #333;
        color: white;
        border: none;
        border-radius: 4px;
    }
    button:hover {
        background-color: #555;
    }
    </style>
</head>
<body>
    <h2>Exercise 2: Move the Box</h2>
    <p><button onclick="myMove()">Click Me</button></p>
    <div id="container">
      <div id="animate"></div>
    </div>

    <script src="exercise2-move-box.js"></script>
</body>
</html>
