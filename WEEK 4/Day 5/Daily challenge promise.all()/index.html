<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise Time</title>
</head>
<body>

    <h1>Sunrise Time Calculator</h1>

    <form id="sunriseForm">

        <h2>First City</h2>

        <label for="lat1">Latitude:</label>
        <input type="number" id="lat1" step="any" required>

        <label for="lon1">Longitude:</label>
        <input type="number" id="lon1" step="any" required>

        <h2>Second City</h2>

        <label for="lat2">Latitude:</label>
        <input type="number" id="lat2" step="any" required>

        <label for="lon2">Longitude:</label>
        <input type="number" id="lon2" step="any" required>

        <br><br>

        <button type="submit">Get Sunrise</button>
    </form>

    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>
